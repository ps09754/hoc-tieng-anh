<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh sách từ vựng theo chủ đề</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1 class="title" id="topicTitle">Danh sách từ vựng</h1>
        <p class="subtitle" id="topicSubtitle">Đang tải dữ liệu...</p>
        <div class="header-controls">
          <button class="btn secondary" id="downloadTemplateBtn">
            Tải mẫu Excel
          </button>
          <button class="btn" id="uploadExcelBtn">Tải lên Excel</button>
          <button class="btn secondary" id="resetCustomBtn" disabled>
            Reset từ vựng
          </button>
          <input
            id="excelInput"
            type="file"
            accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            hidden
          />
          <span class="hint">Hỗ trợ .xlsx</span>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="card">
        <div class="table-wrap">
          <table aria-label="Danh sách từ vựng">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Từ vựng</th>
                <th scope="col" class="col-transcription">Phiên âm</th>
                <th scope="col">Nghĩa tiếng Việt</th>
                <th scope="col" class="col-audio">Nghe phát âm</th>
              </tr>
            </thead>
            <tbody id="vocabBody"></tbody>
          </table>
        </div>
        
        <!-- Pagination Controls -->
        <div class="pagination">
          <button class="btn secondary" id="prevPageBtn" disabled>Trước</button>
          <span class="pagination-info" id="pageInfo">Trang 1 / 1</span>
          <button class="btn secondary" id="nextPageBtn" disabled>Sau</button>
        </div>
      </div>
    </main>

    <div
      class="controls"
      id="controls"
      role="region"
      aria-label="Điều khiển phát âm"
    >
      <div class="mobile-now" id="mobileNow" aria-live="polite">
        <div class="mobile-now-word" id="mobileNowWord">---</div>
        <div class="mobile-now-meaning" id="mobileNowMeaning">---</div>
      </div>
      <div class="group playback-group">
        <span class="pill" id="autoStatus">Tự động: Tắt</span>
        <button class="btn" id="autoPlayBtn">Tự động phát</button>
        <button class="btn" id="bilingualBtn">Tự động song ngữ</button>
        <button class="btn secondary" id="stopBtn" disabled>Dừng</button>
      </div>
      <div class="group control-actions action-group">
        <button class="btn secondary" id="expandBtn">Phóng to</button>
        <button class="btn secondary" id="pipBtn">Trình phát nền</button>
        <button class="btn" id="replayBtn">Nghe lại</button>
      </div>
      <div class="group range-inputs">
        <label for="startInput">Đọc từ</label>
        <input id="startInput" type="number" min="1" step="1" value="1" />
        <label for="endInput">đến</label>
        <input id="endInput" type="number" min="1" step="1" value="1" />
        <label class="toggle" for="loopInput">
          <input id="loopInput" type="checkbox" />
          Lặp lại
        </label>
      </div>
      <div class="group">
        <label for="delayInput">Nghỉ (giây)</label>
        <input
          id="delayInput"
          type="number"
          min="1"
          max="10"
          step="0.5"
          value="4"
        />
      </div>
      <div class="group">
        <label for="rateInput">Tốc độ</label>
        <input
          id="rateInput"
          type="range"
          min="0.6"
          max="1.2"
          step="0.05"
          value="0.6"
        />
        <span class="status" id="rateLabel">0.6x</span>
      </div>
      <div class="group">
        <label for="volume">Âm lượng</label>
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="1"
        />
        <span class="status" id="volumeLabel">100%</span>
      </div>
    </div>

    <div class="overlay" id="fullOverlay" aria-hidden="true">
      <p class="overlay-word" id="overlayWord">---</p>
      <p class="overlay-transcription" id="overlayTranscription">---</p>
      <p class="overlay-meaning" id="overlayMeaning">---</p>
      <div class="overlay-actions">
        <button class="btn secondary" id="shrinkBtn">Thu nhỏ</button>
        <button class="btn" id="overlayReplayBtn">Nghe lại</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
