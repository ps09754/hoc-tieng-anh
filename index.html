<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danh sách từ vựng theo chủ đề</title>
  <style>
    :root {
      --bg: #f7f3ea;
      --ink: #1a1a1a;
      --muted: #5b5b5b;
      --accent: #d65a31;
      --accent-2: #3d5a80;
      --card: #ffffff;
      --border: #e2dccf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 10%, #fff8ea 0%, #f3efe6 50%, #efe9dd 100%);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      padding: 24px 20px 8px;
    }

    .title {
      font-size: 28px;
      letter-spacing: 0.5px;
      margin: 0 0 4px;
      color: var(--accent-2);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .topic-bar {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .topic-label {
      font-size: 14px;
      color: var(--accent-2);
      font-weight: 600;
    }

    .topic-select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fffdfa;
      color: var(--ink);
      font-size: 14px;
      min-width: 220px;
    }

    .container {
      padding: 0 20px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fffdfa;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #fbf6e9;
      font-weight: 600;
      color: var(--accent-2);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr.active {
      background: #fff0d6;
    }

    .btn {
      border: none;
      background: var(--accent);
      color: white;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s ease, filter 0.2s ease;
      white-space: nowrap;
    }

    .btn.secondary {
      background: var(--accent-2);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      filter: grayscale(1);
      opacity: 0.6;
      cursor: not-allowed;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e1b16;
      color: #fef6e4;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid #3b2f2f;
      z-index: 10;
    }

    .controls .group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 14px;
      color: #f7e1b5;
    }

    .controls input[type="range"] {
      accent-color: var(--accent);
    }

    .status {
      font-size: 14px;
      color: #f7e1b5;
    }

    .pill {
      background: #2d2620;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #4c3b2e;
    }

    @media (max-width: 720px) {
      .title {
        font-size: 22px;
      }

      .subtitle {
        font-size: 14px;
      }

      table {
        min-width: 520px;
      }

      th, td {
        padding: 10px 8px;
        font-size: 14px;
      }

      .controls {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .controls .group {
        width: 100%;
        justify-content: space-between;
      }

      .topic-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .topic-select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1 class="title" id="topicTitle">Danh sách từ vựng</h1>
      <p class="subtitle" id="topicSubtitle">Đang tải dữ liệu...</p>
      <div class="topic-bar">
        <label class="topic-label" for="topicSelect">Chọn chủ đề</label>
        <select class="topic-select" id="topicSelect" aria-label="Chọn chủ đề"></select>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="table-wrap">
        <table aria-label="Danh sách từ vựng">
          <thead>
            <tr>
              <th>#</th>
              <th>Từ vựng</th>
              <th>Phiên âm</th>
              <th>Nghĩa tiếng Việt</th>
              <th>Nghe phát âm</th>
            </tr>
          </thead>
          <tbody id="vocabBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="controls" role="region" aria-label="Điều khiển phát âm">
    <div class="group">
      <span class="pill" id="autoStatus">Tự động: Tắt</span>
      <button class="btn" id="autoPlayBtn">Tự động phát</button>
      <button class="btn secondary" id="stopBtn" disabled>Dừng</button>
    </div>
    <div class="group">
      <label for="volume">Âm lượng</label>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.9" />
      <span class="status" id="volumeLabel">90%</span>
    </div>
  </div>

  <script>
    const vocabBody = document.getElementById("vocabBody");
    const topicTitle = document.getElementById("topicTitle");
    const topicSubtitle = document.getElementById("topicSubtitle");
    const topicSelect = document.getElementById("topicSelect");
    const autoPlayBtn = document.getElementById("autoPlayBtn");
    const stopBtn = document.getElementById("stopBtn");
    const autoStatus = document.getElementById("autoStatus");
    const volumeInput = document.getElementById("volume");
    const volumeLabel = document.getElementById("volumeLabel");

    let topics = [];
    let vocabList = [];
    let currentTopicIndex = 0;
    let autoPlaying = false;
    let currentIndex = -1;
    let volume = Number(volumeInput.value);

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const setActiveRow = (index) => {
      const rows = vocabBody.querySelectorAll("tr");
      rows.forEach((row, i) => {
        if (i === index) {
          row.classList.add("active");
        } else {
          row.classList.remove("active");
        }
      });
    };

    const speakWord = (word) => {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) {
          resolve();
          return;
        }
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.volume = volume;
        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      });
    };

    const stopAll = () => {
      autoPlaying = false;
      currentIndex = -1;
      autoStatus.textContent = "Tự động: Tắt";
      autoPlayBtn.disabled = false;
      stopBtn.disabled = true;
      setActiveRow(-1);
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    };

    const startAutoPlay = async () => {
      if (!vocabList.length) return;
      autoPlaying = true;
      autoStatus.textContent = "Tự động: Đang phát";
      autoPlayBtn.disabled = true;
      stopBtn.disabled = false;

      for (let i = 0; i < vocabList.length; i += 1) {
        if (!autoPlaying) break;
        currentIndex = i;
        setActiveRow(i);
        await speakWord(vocabList[i].text);
        if (!autoPlaying) break;
        await sleep(2000);
      }

      if (autoPlaying) {
        stopAll();
      }
    };

    const renderTable = (items) => {
      vocabBody.innerHTML = "";
      items.forEach((item, index) => {
        const transcription = item.transcription ? `/${item.transcription}/` : "";
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.text}</td>
          <td>${transcription}</td>
          <td>${item.vietnamese_meaning}</td>
          <td><button class="btn" data-index="${index}">Nghe</button></td>
        `;
        vocabBody.appendChild(row);
      });
    };

    const bindRowButtons = () => {
      vocabBody.addEventListener("click", async (event) => {
        const target = event.target;
        if (target.tagName !== "BUTTON") return;
        const index = Number(target.getAttribute("data-index"));
        if (Number.isNaN(index)) return;
        stopAll();
        currentIndex = index;
        setActiveRow(index);
        await speakWord(vocabList[index].text);
      });
    };

    const loadData = async () => {
      try {
        const response = await fetch("vocabulary.json");
        const data = await response.json();
        topics = Array.isArray(data) ? data : data && data.Topic ? [data] : [];
        if (!topics.length) {
          topicSubtitle.textContent = "Không có dữ liệu từ vựng.";
          return;
        }

        topicSelect.innerHTML = "";
        topics.forEach((topic, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = topic.Topic || `Chủ đề ${index + 1}`;
          topicSelect.appendChild(option);
        });

        currentTopicIndex = 0;
        topicSelect.value = "0";
        vocabList = topics[currentTopicIndex].data || [];
        topicTitle.textContent = `Chủ đề: ${topics[currentTopicIndex].Topic || "Danh sách từ vựng"}`;
        topicSubtitle.textContent = `Tổng số từ: ${vocabList.length}`;
        renderTable(vocabList);
      } catch (error) {
        topicSubtitle.textContent = "Không thể tải dữ liệu từ vựng.";
      }
    };

    topicSelect.addEventListener("change", (event) => {
      const nextIndex = Number(event.target.value);
      if (Number.isNaN(nextIndex) || !topics[nextIndex]) return;
      stopAll();
      currentTopicIndex = nextIndex;
      vocabList = topics[currentTopicIndex].data || [];
      topicTitle.textContent = `Chủ đề: ${topics[currentTopicIndex].Topic || "Danh sách từ vựng"}`;
      topicSubtitle.textContent = `Tổng số từ: ${vocabList.length}`;
      renderTable(vocabList);
    });

    autoPlayBtn.addEventListener("click", () => {
      startAutoPlay();
    });

    stopBtn.addEventListener("click", () => {
      stopAll();
    });

    volumeInput.addEventListener("input", (event) => {
      const value = Number(event.target.value);
      volume = value;
      volumeLabel.textContent = `${Math.round(value * 100)}%`;
    });

    bindRowButtons();
    loadData();
  </script>
</body>
</html>
